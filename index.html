<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midrash Elyon Shul Publications - Print & Mobile Perfect</title>
    
    <!-- Libraries for JPG and PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600;700&family=David+Libre:wght@400;500;700&display=swap');

        /* Strict Screen Locks */
        html, body {
            width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px 0;
        }

        .flyer-wrapper {
            position: relative;
            width: 816px;
            height: 1056px;
            flex-shrink: 0;
        }

        /* Rigidly locked to exactly 8.5x11 inches @ 96DPI (816x1056) */
        .print-page {
            background-color: #ffffff;
            width: 816px; 
            height: 1056px; 
            box-sizing: border-box;
            position: relative;
            color: #631000; 
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        /* ==========================================================================
           TEMPLATE 1: WEEKLY SCHEDULE FLYER (Fixed Pixel Sizing)
           ========================================================================== */
        .schedule-layout {
            padding: 24px 48px;
            font-family: 'Cinzel', serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%;
            box-sizing: border-box;
            position: relative;
            border: 14px solid #631000;
            outline: 3px double #c5a059;
            outline-offset: -10px;
            overflow: hidden; 
        }

        .schedule-content-container { 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            flex: 1; 
            height: 100%;
            box-sizing: border-box;
        }

        .schedule-content-container > .time-box:last-of-type {
            margin-bottom: 25px;
        }

        .bsd { 
            font-family: 'David Libre', serif; 
            font-size: 18px; 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            margin: 0; 
            font-weight: 700; 
            color: #631000; 
            z-index: 10;
        }

        .header-grid { 
            display: grid; 
            grid-template-columns: 1.2fr 1fr 1.2fr; 
            align-items: center; 
            margin-top: 5px; 
            border-bottom: 2px solid #631000; 
            padding-bottom: 8px; 
            gap: 10px; 
        }

        .grid-left { 
            font-family: 'David Libre', serif; 
            font-size: 21px; 
            font-weight: 700; 
            text-align: left; 
            line-height: 1.2; 
            color: #631000; 
            white-space: nowrap; 
        }

        .grid-center { text-align: center; }

        .grid-right { 
            font-size: 13.5px; 
            font-weight: 700; 
            text-align: right; 
            letter-spacing: 0.3px; 
            line-height: 1.3; 
            color: #631000; 
            white-space: nowrap; 
        }

        .entrance-note { 
            font-size: 11px; 
            font-weight: 500; 
            color: #631000; 
            display: block; 
            margin-top: 2px; 
        }

        .logo-img { 
            width: 220px; 
            height: auto; 
            display: block; 
            margin: 0 auto; 
            filter: drop-shadow(0px 2px 4px rgba(11, 35, 71, 0.15)); 
        }

        .logo-deal { 
            font-family: 'Cinzel Decorative', serif; 
            font-size: 18px; 
            font-weight: 700; 
            letter-spacing: 6px; 
            margin-top: 4px; 
            color: #631000; 
        }

        .section-title { 
            font-size: 17px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            color: #c5a059; 
            margin: 6px 0 2px 0; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            white-space: nowrap; 
        }

        .section-title::before, .section-title::after { 
            content: ''; 
            flex: 1; 
            height: 2px; 
            background: linear-gradient(to var(--dir, right), #c5a059, transparent); 
            margin: 0 15px; 
        }
        .section-title::after { --dir: left; }

        .time-box { padding: 0 10px; margin-bottom: 2px; }
        
        .time-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 16px; 
            font-weight: 600; 
            margin: 1.5px 0; 
            letter-spacing: 0.5px; 
            border-bottom: 1px dashed #e2e8f0; 
            padding-bottom: 1.5px; 
            white-space: nowrap; 
        }

        .time-row.highlight { 
            font-weight: 700; 
            border-bottom: 1px dashed rgba(217, 56, 56, 0.3); 
        }

        .row-full { 
            font-size: 13.5px; 
            font-weight: 700; 
            color: #631000; 
            margin-top: 2px; 
            letter-spacing: 0.5px; 
            white-space: nowrap; 
        }

        /* Dedications Container: Sits at bottom, shrink-wraps contents, stops 25px under schedule */
        .dedications-box { 
            background: linear-gradient(135deg, #fdfbf7 0%, #fcf9f2 100%); 
            border: 2px solid #eadeca; 
            border-top: 4px solid #c5a059; 
            border-radius: 6px; 
            margin-top: auto; 
            flex: 0 0 auto;
            height: fit-content;
            box-shadow: inset 0 0 10px rgba(197, 160, 89, 0.05); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .dedications-columns { 
            display: flex; 
            justify-content: space-around; 
            align-items: flex-start; 
            gap: 16px; 
            width: 100%; 
            box-sizing: border-box;
        }

        .dedications-column { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        .dedications-column:not(:last-child) { 
            border-right: 1px dashed #eadeca; 
            padding-right: 12px; 
        }

        .dedication-entry { padding-bottom: 2px; }
        
        .dedication-title { 
            font-family: 'Cinzel Decorative', serif; 
            font-weight: 700; 
            color: #631000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            white-space: nowrap; 
        }

        .dedication-title::before, .dedication-title::after { 
            content: '◆'; 
            font-size: 8px; 
        }
        
        .dedication-type { 
            font-weight: 700; 
            color: #c5a059; 
            text-transform: uppercase; 
            white-space: normal; 
        }

        .dedication-text { 
            font-weight: 600; 
            color: #631000; 
        }

        .dedication-text strong { 
            font-weight: 700; 
            font-size: inherit; 
        }

        .dedications-box.count-1 { padding: 25px 25px; }
        .dedications-box.count-1 .dedication-title { font-size: 20px; letter-spacing: 4px; margin-bottom: 12px; }
        .dedications-box.count-1 .dedication-type { font-size: 16px; letter-spacing: 2px; margin-bottom: 6px; }
        .dedications-box.count-1 .dedication-text { font-size: 16px; line-height: 1.45; }
        
        .dedications-box.count-2 { padding: 20px 20px; }
        .dedications-box.count-2 .dedication-title { font-size: 18px; letter-spacing: 3px; margin-bottom: 10px; }
        .dedications-box.count-2 .dedication-type { font-size: 15px; letter-spacing: 1.5px; margin-bottom: 5px; }
        .dedications-box.count-2 .dedication-text { font-size: 16px; line-height: 1.4; }

        .dedications-box.count-3-plus { padding: 14px 16px; }
        .dedications-box.count-3-plus .dedication-title { font-size: 16px; letter-spacing: 2px; margin-bottom: 6px; }
        .dedications-box.count-3-plus .dedication-type { font-size: 14px; letter-spacing: 1.2px; margin-bottom: 4px; }
        .dedications-box.count-3-plus .dedication-text { font-size: 14.5px; line-height: 1.35; }

        .dedications-box.has-dense-stack { padding: 12px 14px; }
        .dedications-box.has-dense-stack .dedications-column { gap: 8px; }
        .dedications-box.has-dense-stack .dedication-title { font-size: 15px; letter-spacing: 2px; margin-bottom: 4px; }
        .dedications-box.has-dense-stack .dedication-type { font-size: 12.5px; letter-spacing: 1px; margin-bottom: 2px; }
        .dedications-box.has-dense-stack .dedication-text { font-size: 13px; line-height: 1.25; }

        /* ==========================================================================
           TEMPLATE 2: TABLE DEDICATION FLYER (Adaptive Count Rules)
           ========================================================================== */
        .table-layout { 
            font-family: 'Cinzel', serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100%; 
            box-sizing: border-box; 
            background-color: #ffffff; 
            position: relative; 
            border: 24px solid #631000; 
            outline: 6px double #c5a059; 
            outline-offset: -18px; 
        }

        .table-layout .bsd { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            font-size: 19px; 
            color: #c5a059; 
        }

        .table-parsha { 
            font-family: 'David Libre', serif; 
            font-weight: 700; 
            color: #631000; 
            text-shadow: 2px 2px 0px rgba(197, 160, 89, 0.3); 
        }

        .table-purpose { 
            font-family: 'Cinzel Decorative', serif; 
            font-weight: 700; 
            color: #631000; 
            text-transform: uppercase; 
        }

        .table-is-dedicated { 
            font-weight: 600; 
            text-transform: uppercase; 
            color: #631000; 
        }

        .diamond-separator { color: #c5a059; }

        .table-dedications-container { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            width: 100%; 
        }

        .table-dedication-block { 
            color: #631000; 
            width: 100%; 
        }

        .table-dedication-block span { display: block; }
        
        .table-dedication-block .bold-core-dedication { 
            font-weight: 700; 
            color: #631000; 
            text-transform: uppercase; 
        }

        .table-dedication-block .by-line { 
            font-family: 'Cinzel Decorative', serif; 
            font-weight: 700; 
            color: #631000; 
            text-transform: uppercase; 
        }

        .table-text-divider { 
            font-family: 'Cinzel Decorative', serif; 
            font-weight: 700; 
            color: #631000; 
        }

        /* --- Template 2: Single Dedication --- */
        .table-layout.table-count-1 { padding: 48px; }
        .table-layout.table-count-1 .logo-img { width: 340px; margin-bottom: 5px; margin-top: 10px; }
        .table-layout.table-count-1 .table-parsha { font-size: 58px; margin: 5px 0 10px 0; }
        .table-layout.table-count-1 .table-purpose { font-size: 38px; letter-spacing: 3px; margin-bottom: 2px; line-height: 1.2; }
        .table-layout.table-count-1 .table-is-dedicated { font-size: 22px; margin-bottom: 8px; letter-spacing: 5px; }
        .table-layout.table-count-1 .diamond-separator { font-size: 20px; margin: 5px 0 16px 0; letter-spacing: 12px; }
        .table-layout.table-count-1 .table-dedications-container { gap: 12px; }
        .table-layout.table-count-1 .table-dedication-block { font-size: 23px; line-height: 1.5; font-weight: 500; }
        .table-layout.table-count-1 .table-dedication-block .bold-core-dedication { font-size: 32px; letter-spacing: 0.5px; line-height: 1.25; margin: 8px 0; }
        .table-layout.table-count-1 .table-dedication-block .by-line { margin-top: 10px; font-size: 26px; letter-spacing: 1px; }
        .table-layout.table-count-1 .table-text-divider { font-size: 20px; margin: 4px 0; letter-spacing: 2px; }

        /* --- Template 2: Two Dedications --- */
        .table-layout.table-count-2 { padding: 34px 44px; }
        .table-layout.table-count-2 .logo-img { width: 340px; margin-bottom: 3px; margin-top: 5px; }
        .table-layout.table-count-2 .table-parsha { font-size: 58px; margin: 3px 0 6px 0; }
        .table-layout.table-count-2 .table-purpose { font-size: 38px; letter-spacing: 2px; margin-bottom: 2px; line-height: 1.15; }
        .table-layout.table-count-2 .table-is-dedicated { font-size: 22px; margin-bottom: 5px; letter-spacing: 4px; }
        .table-layout.table-count-2 .diamond-separator { font-size: 16px; margin: 3px 0 10px 0; letter-spacing: 10px; }
        .table-layout.table-count-2 .table-dedications-container { gap: 8px; }
        .table-layout.table-count-2 .table-dedication-block { font-size: 23px; line-height: 1.35; font-weight: 500; }
        .table-layout.table-count-2 .table-dedication-block .bold-core-dedication { font-size: 32px; letter-spacing: 0.4px; line-height: 1.2; margin: 5px 0; }
        .table-layout.table-count-2 .table-dedication-block .by-line { margin-top: 6px; font-size: 26px; letter-spacing: 1px; }
        .table-layout.table-count-2 .table-text-divider { font-size: 16px; margin: 2px 0; letter-spacing: 2px; }

        /* --- Template 2: Three or More Dedications (Optimized Space-Filling) --- */
        .table-layout.table-count-3-plus { 
            padding: 10px 36px; 
            justify-content: space-evenly; 
        }
        .table-layout.table-count-3-plus .logo-img { 
            width: 340; 
            margin-bottom: 0; 
            margin-top: 5px; 
        }
        .table-layout.table-count-3-plus .table-parsha { 
            font-size: 58px; 
            margin: 4px 0 6px 0; 
        }
        .table-layout.table-count-3-plus .table-purpose { 
            font-size: 38px; 
            letter-spacing: 3px; 
            margin-bottom: 2px; 
            line-height: 1.15; 
        }
        .table-layout.table-count-3-plus .table-is-dedicated { 
            font-size: 22px; 
            margin-bottom: 4px; 
            letter-spacing: 4px; 
        }
        .table-layout.table-count-3-plus .diamond-separator { 
            font-size: 13px; 
            margin: 4px 0 12px 0; 
            letter-spacing: 10px; 
        }
        .table-layout.table-count-3-plus .table-dedications-container { 
            gap: 5px; 
            <!-- flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; -->
        }
        .table-layout.table-count-3-plus .table-dedication-block { 
            font-size: 20px; 
            line-height: 1.25; 
            font-weight: 500; 
        }
        .table-layout.table-count-3-plus .table-dedication-block .bold-core-dedication { 
            font-size: 26px; 
            letter-spacing: 0.4px; 
            line-height: 1.2; 
            margin: 4px 0; 
        }
        .table-layout.table-count-3-plus .table-dedication-block .by-line { 
            margin-top: 4px; 
            font-size: 20px; 
            letter-spacing: 0.5px; 
        }
        .table-layout.table-count-3-plus .table-text-divider { 
            font-size: 15px; 
            margin: 4px 0; 
            letter-spacing: 2px; 
        }

        /* ==========================================================================
           TEMPLATE 3: 1920x1080 TV DISPLAY BOARD
           ========================================================================== */
        .tv-wrapper {
            position: relative;
            width: 1920px;
            height: 1080px;
            flex-shrink: 0;
        }

        .tv-page {
            background-color: #ffffff;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            position: relative;
            color: #631000;
            overflow: hidden;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
            border: 20px solid #631000;
            outline: 6px double #c5a059;
            outline-offset: -13px;
            padding: 24px 40px;
            display: flex;
            flex-direction: row;
            gap: 36px;
            font-family: 'Cinzel', serif;
        }

        .tv-page .bsd {
            top: 0px;
            right: 20px;
            font-size: 24px;
            font-family: 'David Libre', serif;
            font-weight: 700;
            color: #631000;
            position: absolute;
            margin: 0;
            z-index: 20;
            line-height: 1;
        }

        .tv-col-left {
            flex: 1.12;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 3px double #c5a059;
            padding-right: 36px;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Cinzel', serif;
        }

        .tv-col-left .header-grid {
            margin-top: 0;
            padding-bottom: 8px;
            border-bottom: 2.5px solid #631000;
        }
        .tv-col-left .grid-left { 
            font-family: 'David Libre', serif; 
            font-size: 30px; 
            line-height: 1.2; 
        }
        .tv-col-left .logo-img { width: 310px; }
        .tv-col-left .grid-right { 
            font-family: 'Cinzel', serif;
            font-size: 19px; 
            line-height: 1.3; 
        }
        .tv-col-left .entrance-note { 
            font-family: 'Cinzel', serif;
            font-size: 14px; 
        }

        .tv-schedule-boxes-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            margin-top: 10px;
            gap: 8px;
        }

        .tv-schedule-card {
            background: linear-gradient(135deg, #fdfbf7 0%, #fcf9f2 100%);
            border: 2px solid #eadeca;
            border-top: 4px solid #c5a059;
            border-radius: 8px;
            padding: 8px 22px 10px 22px;
            box-shadow: inset 0 0 10px rgba(197, 160, 89, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tv-col-left .section-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            margin: 0 0 6px 0;

        }
        .tv-col-left .time-row {
            font-family: 'Cinzel', serif;
            font-size: 23px;
            margin: 3.5px 0;
            padding-bottom: 3.5px;
            border-bottom: 1.5px dashed #e2e8f0;
        }
        .tv-col-left .time-row.highlight {
            border-bottom: 2px dashed rgba(217, 56, 56, 0.4);
        }
        .tv-col-left .row-full {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-top: 4px;
            margin-bottom: 2px;
            line-height: 1.25;
            text-align: center;
        }

        .tv-col-right {
            flex: 0.88;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            height: 100%;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            background: linear-gradient(135deg, #fdfbf7 0%, #fcf9f2 100%);
            border: 2px solid #eadeca;
            border-top: 5px solid #c5a059;
            border-radius: 10px;
            box-shadow: inset 0 0 14px rgba(197, 160, 89, 0.08);
        }

        .tv-col-right .table-parsha {
            font-family: 'David Libre', serif;
            font-size: 60px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #631000;
            text-shadow: 2px 2px 0px rgba(197, 160, 89, 0.35);
        }

        .tv-dedications-scrollable {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            flex: 1;
            width: 100%;
            gap: 12px;
        }

        .tv-category-group {
            width: 100%;
            display: flex;

        }

        .tv-category-divider {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            color: #c5a059;
            font-size: 18px;
            letter-spacing: 12px;

        }

        .tv-col-right .table-purpose {
            font-family: 'Cinzel Decorative', serif;
            font-size: 38px;

        .tv-col-right.tv-dense-stack .table-parsha { font-size: 46px; margin: 0 0 4px 0; }
        .tv-col-right.tv-dense-stack .table-purpose { font-size: 28px; letter-spacing: 3px; }
        .tv-col-right.tv-dense-stack .table-is-dedicated { font-size: 17px; margin-bottom: 2px; letter-spacing: 4px; }
        .tv-col-right.tv-dense-stack .diamond-separator { font-size: 13px; margin: 3px 0 6px 0; letter-spacing: 9px; }
        .tv-col-right.tv-dense-stack .table-dedications-container { gap: 6px; }
        .tv-col-right.tv-dense-stack .table-dedication-block { font-size: 16px; line-height: 1.25; }

        .tv-col-right.tv-dense-stack .table-dedication-block .by-line { font-size: 18px; margin-top: 3px; }
        .tv-col-right.tv-dense-stack .table-text-divider { font-size: 15px; margin: 2px 0; }
        .tv-col-right.tv-dense-stack .tv-category-divider { margin: 8px 0; font-size: 14px; }

    <script>
        function executeMobileScaling() {
            if (window.matchMedia && window.matchMedia('print').matches) return;

            const screenWidth = document.body.clientWidth;
            const targetWidthPortrait = screenWidth - 20; 

            // Scale Portrait Flyers
            const wrappers = document.querySelectorAll('.flyer-wrapper');
            if (targetWidthPortrait < 816) {
                const scaleFactor = targetWidthPortrait / 816;
                wrappers.forEach(wrapper => {
                    wrapper.style.width = targetWidthPortrait + 'px';
                    wrapper.style.height = (1056 * scaleFactor) + 'px';
                    
                    const page = wrapper.querySelector('.print-page');
                    if (page) {
                        page.style.position = 'absolute';
                        page.style.top = '0';
                        page.style.left = '0';
                        page.style.transformOrigin = 'top left';
                        page.style.transform = `scale(${scaleFactor})`;
                        page.style.boxShadow = 'none';
                    }
                });
            } else {
                wrappers.forEach(wrapper => {
                    wrapper.style.width = '816px';
                    wrapper.style.height = '1056px';
                    const page = wrapper.querySelector('.print-page');
                    if (page) {
                        page.style.position = 'relative';
                        page.style.transform = 'none';
                        page.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.15)';
                    }
                });
            }

            // Scale Landscape TV Display
            const tvWrapper = document.querySelector('.tv-wrapper');
            if (tvWrapper) {
                const maxAvailableWidth = Math.min(screenWidth - 20, 1920);
                if (maxAvailableWidth < 1920) {
                    const tvScale = maxAvailableWidth / 1920;
                    tvWrapper.style.width = maxAvailableWidth + 'px';
                    tvWrapper.style.height = (1080 * tvScale) + 'px';
                    const tvPage = tvWrapper.querySelector('.tv-page');
                    if (tvPage) {
                        tvPage.style.position = 'absolute';
                        tvPage.style.top = '0';
                        tvPage.style.left = '0';
                        tvPage.style.transformOrigin = 'top left';
                        tvPage.style.transform = `scale(${tvScale})`;
                        tvPage.style.boxShadow = 'none';
                    }
                } else {
                    tvWrapper.style.width = '1920px';
                    tvWrapper.style.height = '1080px';
                    const tvPage = tvWrapper.querySelector('.tv-page');
                    if (tvPage) {
                        tvPage.style.position = 'relative';
                        tvPage.style.transform = 'none';
                        tvPage.style.boxShadow = '0 6px 30px rgba(0, 0, 0, 0.2)';
                    }
                }
            }
        }
        
        window.addEventListener('resize', executeMobileScaling);

        async function downloadAllJPGs() {

            const pages = document.querySelectorAll('.print-page');
            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                const originalTransform = page.style.transform;
                const originalPosition = page.style.position;
                
                page.style.transform = 'none';
                page.style.position = 'relative';

                const canvas = await html2canvas(page, {
                    scale: 2, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    width: 816,
                    height: 1056,
                    windowWidth: 816,
                    windowHeight: 1056
                });

                page.style.transform = originalTransform;
                page.style.position = originalPosition;

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'in', [8.5, 11]);
            
            const pages = document.querySelectorAll('.print-page');
            let isFirstPageAdded = false;

            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                
                let copies = 1;
                if (i === 0 || i === 1) {
                    copies = 1;
                } else {
                    const purposeEl = page.querySelector('.table-purpose');
                    if (purposeEl && purposeEl.innerText.toUpperCase().includes('SHABBAT KIDDUSH')) {
                        copies = 8;
                    } else {
                        copies = 6;
                    }
                }

                const originalTransform = page.style.transform;
                const originalPosition = page.style.position;
                
                page.style.transform = 'none';
                page.style.position = 'relative';

                const canvas = await html2canvas(page, {
                    scale: 2, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    width: 816,
                    height: 1056,
                    windowWidth: 816,
                    windowHeight: 1056
                });

                page.style.transform = originalTransform;
                page.style.position = originalPosition;

                const imgData = canvas.toDataURL('image/jpeg', 0.95);

                for (let c = 0; c < copies; c++) {
                    if (isFirstPageAdded) {
                        pdf.addPage();
                    }
                    pdf.addImage(imgData, 'JPEG', 0, 0, 8.5, 11);
                    isFirstPageAdded = true;
                }
            }
            
            pdf.save('Midrash_Elyon_Publications.pdf');
            btn.innerText = "DOWNLOAD CUSTOM BATCH PDF";
            btn.disabled = false;
            jpgBtn.disabled = false;
            if (tvBtn) tvBtn.disabled = false;
        }

        /* ==========================================================================

        const SIGNATURE_KEY = '2PACX-1vQkcfkH_BAJSdXzKzQguibMZ-I6K7drGRkLwFygZ8iDgeq3OmVTTnSPRpSmGQAp3MfbfDJjXc2XLNe7';
        const DIRECT_CSV_FEED = `https://docs.google.com/spreadsheets/d/e/${SIGNATURE_KEY}/pub?output=csv&sheet=WebsiteInfo`;

        fetch(DIRECT_CSV_FEED)

                const parsedRows = parseCSVRows(csvText);
                
                const englishDateHeader = parsedRows[3]?.[1] || 'June 26 - 27 2026';

                const hebrewParshaValue = parsedRows[4]?.[1] || 'קרח';

        function parseCSVRows(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                let next = text[i+1];
                if (c === '"') { 
                    if (q && next === '"') { row[row.length - 1] += '"'; i++; } 
                    else { q = !q; }
                } else if (c === ',' && !q) { 
                    row.push(''); 
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && next === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else { 
                    row[row.length - 1] += c; 
                }
            }
            if (row.length > 1 || row[0] !== '') r.push(row);
            return r;
        }

        function buildDedicationsHTML(groupedObj) {
            const keys = Object.keys(groupedObj);
            let count = 0;
            let maxInAnyColumn = 0;

            keys.forEach(k => {
                const len = groupedObj[k].length;
                count += len;
                if (len > maxInAnyColumn) maxInAnyColumn = len;
            });

            if (count === 0) return '';

            let scaleClass = 'count-3-plus';
            if (count === 1) scaleClass = 'count-1';
            else if (count === 2) scaleClass = 'count-2';

            if (maxInAnyColumn >= 3) {
                scaleClass += ' has-dense-stack';
            }

            let columnsHTML = '';
            for (const [type, items] of Object.entries(groupedObj)) {
                columnsHTML += `<div class="dedications-column">`;
                items.forEach(item => {
                    columnsHTML += `
                        <div class="dedication-entry">
                            <div class="dedication-type">${type}</div>
                            <div class="dedication-text">
                                ${item.prefix ? `${item.prefix.toUpperCase()}<br>` : ''}
                                <strong>${item.honor}</strong>
                                ${item.by ? `<br><span style="font-weight: 700; color: #c5a059;">BY: ${item.by}</span>` : ''}
                            </div>
                        </div>`;
                });
                columnsHTML += `</div>`;
            }

            return `
            <div class="dedications-box ${scaleClass}">
                <div class="dedication-title">Dedications</div>
                <div class="dedications-columns">
                    ${columnsHTML}
                </div>
            </div>`;
        }

        function processSpreadsheetPayload(dateEnglish, parshaHebrew, candleLighting, rawDedicationsText, hebrewDateHeader, havdalahTime, weekdayShacharit, weekdayPreShacharitLearning, sundayShacharit, shirHashirim, fridayMinha, shabbatMinha, preMinhaClass, hebrewDateWeek, dateWeek, shabbatKorbanot, shabbatShacharit) {
            const textLines = rawDedicationsText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            const categoryMap = {
                "SHABBAT KIDDUSH": "Shabbat Kiddush",
                "SUNDAY BREAKFAST": "Sunday Breakfast",
                "SEUDAT SHELISHEET": "Seudat Shelisheet",
                "SEUDAH SHELISHEET": "Seudat Shelisheet",
                "GAN SHABBAT": "Gan Shabbat",
                "WEEK OF BREAKFAST": "Week of Breakfast",
                "MONTH OF LEARNING": "The Albert “Bero” Chehebar Learning Program<br>Month of Learning",
                "WEEK OF LEARNING": "The Albert “Bero” Chehebar Learning Program<br>Week of Learning",
                "DAY OF LEARNING": "The Albert “Bero” Chehebar Learning Program<br>Day of Learning"
            };
            const allowedCategoryKeys = Object.keys(categoryMap);
            
            const knownPrefixes = [
                "IN HONOR OF", "IN MEMORY OF", "LEILUI NISHMAT", "L'ILUI NISHMAT", 
                "REFUAH SHELEMAH", "REFUAH SHLEMAH", "DEDICATED TO", 
                "IN CELEBRATION OF", "FOR THE HATZLACHA OF", "IN MERIT OF", "IN HONOR AND ZECHUT OF"
            ];
            
            let currentCategory = '';
            const groupedDedications = {};

            for (let i = 0; i < textLines.length; i++) {
                const normalizedLine = textLines[i].toUpperCase();
                
                let foundKey = allowedCategoryKeys.find(k => normalizedLine.includes(k));
                if (foundKey) {
                    currentCategory = categoryMap[foundKey]; 
                    if (!groupedDedications[currentCategory]) {
                        groupedDedications[currentCategory] = [];
                    }
                    continue;
                }
                
                if (normalizedLine === "~AND~" || normalizedLine === "~ AND ~") {
                    continue;
                }

                if (!normalizedLine.startsWith("BY:") && currentCategory) {
                    let isKnownPrefix = knownPrefixes.some(p => normalizedLine.startsWith(p));
                    
                    let prefixText = isKnownPrefix ? textLines[i] : "";
                    let honorText = isKnownPrefix ? "" : textLines[i];
                    let byText = "";
                    
                    while (i + 1 < textLines.length && 
                           !textLines[i + 1].toUpperCase().startsWith("BY:") && 
                           !allowedCategoryKeys.some(k => textLines[i + 1].toUpperCase().includes(k)) && 
                           textLines[i + 1].toUpperCase() !== "~AND~" && 
                           textLines[i + 1].toUpperCase() !== "~ AND ~") {
                        i++;
                        honorText += (honorText ? "<br>" : "") + textLines[i];
                    }
                    
                    if (i + 1 < textLines.length && textLines[i + 1].toUpperCase().startsWith("BY:")) {
                        i++;
                        byText = textLines[i].replace(/^BY:\s*/i, '');
                    }

                    groupedDedications[currentCategory].push({ prefix: prefixText, honor: honorText, by: byText });
                }
            }

            const shabbatCategories = ["Shabbat Kiddush", "Seudat Shelisheet", "Gan Shabbat"];
            const shabbatDedications = {};
            const weekdayDedications = {};

            for (const [cat, items] of Object.entries(groupedDedications)) {
                if (shabbatCategories.includes(cat)) {
                    shabbatDedications[cat] = items;
                } else {
                    weekdayDedications[cat] = items;
                }
            }

            const flyer1BoxHTML = buildDedicationsHTML(shabbatDedications);
            const flyer2BoxHTML = buildDedicationsHTML(weekdayDedications);

            let finalHTML = `

                                <div class="grid-center">

                                    <div class="logo-deal"></div>
                                </div>
                                <div class="grid-right">SHABBAT SCHEDULE<br>${dateEnglish}<br>520 kings highway<br><span class="entrance-note">East 3rd st entrance</span></div>

                                <div class="row-full" style="color: #631000;">FOLLOWED BY AN EXQUISITE KIDDUSH AND CLASS<br>WITH RABBI DAVID HABER</div>
                                <div class="time-row"><span>Danny J. Betesh Boys Program</span><span>9:15AM - 11:30AM</span></div>

                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- PAGE 2: WEEKDAY SCHEDULE FLYER -->
            <div class="flyer-wrapper">
                <div class="print-page">
                    <div class="schedule-layout">
                        <div class="bsd">בס"ד</div>
                        <div class="schedule-content-container">
                            <div class="header-grid">
                                <div class="grid-left">WEEKDAY SCHEDULE<br>${hebrewDateWeek}</div>
                                <div class="grid-center">
                                    <img class="logo-img" src="https://i.postimg.cc/SRBL0ngY/Midrash-Elyon-Newsletter-(8).png" alt="Midrash Elyon Logo">
                                    <div class="logo-deal"></div>
                                </div>
                                <div class="grid-right">${dateWeek}<br>520 kings highway<br><span class="entrance-note">East 3rd st entrance</span></div>
                            </div>

                            <div class="time-box">
                                <div class="section-title">Sunday Schedule</div>
                                <div class="time-row"><span>PRE-SHACHARIT CLASS WITH RABBI TEBELE</span><span>7:20AM</span></div>
                                <div class="time-row" ><span>SHACHARIT</span><span>${sundayShacharit}</span></div>
                                <div class="row-full" style="color: #631000;">FOLLOWED BY DELUXE BREAKFAST & CLASS WITH RABBI DAVID HABER</div>
                            </div>
                            <div class="time-box">
                                <div class="section-title">Weekday Schedule</div>
                                <div class="time-row"><span>GEMARA CLASSES</span><span>${weekdayPreShacharitLearning}</span></div>
                                <div class="time-row"><span>SHACHARIT</span><span>${weekdayShacharit}</span></div>
                                <div class="row-full" style="color: #631000;">FOLLOWED BY BREAKFAST & LEARNING</div>
                            </div>
                            <div class="time-box">
                                <div class="section-title">Learning Program</div>
                                <div class="time-row" style="justify-content: center; font-size: 16px; font-weight: 700; margin-bottom: 2px; border: none;">MONDAY - FRIDAY MORNING</div>
                                <div class="row-full" style="font-weight: 600; margin-bottom: 2px; color: #631000;">MULTIPLE LEARNING GROUPS AT 6:30AM & 8:00AM</div>
                                <div class="row-full" style="font-size: 13.5px; color: #631000;">TO JOIN A CLASS, PLEASE REACH OUT TO RABBI DAVID HABER</div>
                            </div>
                            ${flyer2BoxHTML}
                        </div>
                    </div>
                </div>
            </div>`;

            // Table Dedication Flyers (Portrait)
            for (const [type, items] of Object.entries(groupedDedications)) {
                let countClass = 'table-count-3-plus';
                if (items.length === 1) countClass = 'table-count-1';
                else if (items.length === 2) countClass = 'table-count-2';

                let tableBlocksHTML = items.map(item => `
                    <div class="table-dedication-block">
                        ${item.prefix ? `<span>${item.prefix.toUpperCase()}</span>` : ''}
                        <div class="bold-core-dedication">${item.honor}</div>
                        ${item.by ? `<span class="by-line">BY: ${item.by.toUpperCase()}</span>` : ''}
                    </div>
                `).join('<div class="table-text-divider">~ AND ~</div>');

                finalHTML += `
                <div class="flyer-wrapper">
                    <div class="print-page">
                        <div class="table-layout ${countClass}">
                            <div class="bsd">בס"ד</div>
                            <img class="logo-img" src="https://i.postimg.cc/SRBL0ngY/Midrash-Elyon-Newsletter-(8).png" alt="Midrash Elyon Logo">
                            ${(type === 'Shabbat Kiddush' || type === 'Seudat Shelisheet') ? `<div class="table-parsha">פרשת ${parshaHebrew}</div>` : ''}
                            <div class="table-purpose">${type}</div>
                            <div class="table-is-dedicated">is dedicated</div>
                            <div class="diamond-separator">◆ <span>◆</span> ◆</div>
                            <div class="table-dedications-container">${tableBlocksHTML}</div>
                        </div>
                    </div>
                </div>`;
            }

            // ==========================================================================
            // PAGE: 1920x1080 TV DISPLAY BOARD
            // ==========================================================================
            const activeShabbatCategories = Object.keys(shabbatDedications);
            let tvAllShabbatHTML = '';
            let totalShabbatEntries = 0;

            activeShabbatCategories.forEach(cat => {
                totalShabbatEntries += shabbatDedications[cat].length;
            });

            activeShabbatCategories.forEach((cat, index) => {
                const items = shabbatDedications[cat];
                let blocksHTML = items.map(item => `
                    <div class="table-dedication-block">
                        ${item.prefix ? `<span>${item.prefix.toUpperCase()}</span>` : ''}
                        <div class="bold-core-dedication">${item.honor}</div>
                        ${item.by ? `<span class="by-line">BY: ${item.by.toUpperCase()}</span>` : ''}
                    </div>
                `).join('<div class="table-text-divider">~ AND ~</div>');

                tvAllShabbatHTML += `
                    <div class="tv-category-group">
                        <div class="table-purpose">${cat}</div>
                        <div class="table-is-dedicated">is dedicated</div>
                        <div class="diamond-separator">◆ <span>◆</span> ◆</div>
                        <div class="table-dedications-container">${blocksHTML}</div>
                    </div>
                `;

                if (index < activeShabbatCategories.length - 1) {
                    tvAllShabbatHTML += `<div class="tv-category-divider">◆ ◆ ◆</div>`;
                }
            });

            const tvDenseClass = (activeShabbatCategories.length > 1 || totalShabbatEntries >= 3) ? 'tv-dense-stack' : '';

            finalHTML += `
            <div class="tv-wrapper">
                <div class="tv-page">
                    <div class="bsd">בס"ד</div>
                    
                    <!-- Left Column: Shabbat Schedule -->
                    <div class="tv-col-left">
                        <div class="header-grid">
                            <div class="grid-left">פרשת ${parshaHebrew}<br>${hebrewDateHeader}</div>
                            <div class="grid-center">
                                <img class="logo-img" src="https://i.postimg.cc/SRBL0ngY/Midrash-Elyon-Newsletter-(8).png" alt="Midrash Elyon Logo">
                            </div>
                            <div class="grid-right">SHABBAT SCHEDULE<br>${dateEnglish}<br>520 kings highway<br><span class="entrance-note">East 3rd st entrance</span></div>
                        </div>

                        <div class="tv-schedule-boxes-container">
                            <div class="tv-schedule-card">
                                <div class="section-title">Friday Night</div>
                                <div class="time-row highlight"><span>CANDLE LIGHTING</span><span>${candleLighting}</span></div>
                                <div class="time-row"><span>Shir Hashirim</span><span>${shirHashirim}</span></div>
                                <div class="time-row"><span>Minha</span><span>${fridayMinha}</span></div>
                            </div>

                            <div class="tv-schedule-card">
                                <div class="section-title">Shabbat Morning</div>
                                <div class="time-row"><span>KORBANOT</span><span>${shabbatKorbanot}</span></div>
                                <div class="time-row"><span>HASHEM MELECH</span><span>${shabbatShacharit}</span></div>
                                <div class="row-full" style="color: #631000; font-weight: 700;">FOLLOWED BY AN EXQUISITE KIDDUSH AND CLASS WITH RABBI DAVID HABER</div>
                                <div class="time-row"><span>Danny J. Betesh Boys Program</span><span>9:15AM - 11:30AM</span></div>
                                <div class="time-row"><span>Girls Program</span><span>9:15AM - 11:30AM</span></div>
                                <div class="row-full" style="color: #631000; font-weight: 700;">Mishna Berura Shiur with Rabbi Ralph Tebele Following the speech</div>
                            </div>

                            <div class="tv-schedule-card">
                                <div class="section-title">Shabbat Afternoon</div>
                                <div class="time-row"><span>PRE-MINHA LEARNING PROGRAM</span><span>${preMinhaClass}</span></div>
                                <div class="time-row"><span>MINHA</span><span>${shabbatMinha}</span></div>
                                <div class="row-full" style="color: #631000; font-weight: 700;">FOLLOWED BY SEUDAT SHELISHEET & SPEECH</div>
                                <div class="time-row highlight"><span>HAVDALAH</span><span>${havdalahTime}</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Grand Dedications Card -->
                    <div class="tv-col-right ${tvDenseClass}">
                        <div class="table-parsha">פרשת ${parshaHebrew}</div>
                        <div class="tv-dedications-scrollable">
                            ${tvAllShabbatHTML || `
                                <div class="tv-category-group">
                                    <div class="table-purpose">Shabbat Dedications</div>
                                    <div class="table-is-dedicated">is dedicated</div>
                                    <div class="diamond-separator">◆ <span>◆</span> ◆</div>
                                    <div class="table-dedication-block"><div class="bold-core-dedication">MIDRASH ELYON</div></div>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            </div>`;

            finalHTML += `
            <div class="button-container">
                <button id="downloadJpgBtn" class="action-btn jpg-btn" onclick="downloadAllJPGs()">Download All Pages as JPGs</button>
                <button id="downloadPdfBtn" class="action-btn pdf-btn" onclick="downloadCustomPDF()">Download Custom Batch PDF</button>
                <button id="downloadTvBtn" class="action-btn tv-btn" onclick="downloadTvJPG()">TV Image</button>
            </div>`;

            document.getElementById('loading-state').style.display = 'none';
            const applicationWrapper = document.getElementById('wrapper');
            applicationWrapper.innerHTML = finalHTML;
            applicationWrapper.style.display = 'flex';

            executeMobileScaling();
        }
    </script>
</body>
</html>
